basePath: /
definitions:
  employee.EmployeeRequest:
    properties:
      department:
        example: Engineering
        type: string
      email:
        example: anand@example.com
        type: string
      name:
        example: Anand
        type: string
    required:
    - department
    - email
    - name
    type: object
  httpapi.EmployeeDataResponse:
    properties:
      data:
        $ref: '#/definitions/httpapi.EmployeeResponse'
    type: object
  httpapi.EmployeeListResponse:
    properties:
      data:
        items:
          $ref: '#/definitions/httpapi.EmployeeResponse'
        type: array
    type: object
  httpapi.EmployeeResponse:
    properties:
      department:
        type: string
      email:
        type: string
      id:
        type: integer
      name:
        type: string
    type: object
  httpapi.ErrorDetail:
    properties:
      code:
        example: not_found
        type: string
      message:
        example: employee not found
        type: string
    type: object
  httpapi.ErrorResponse:
    properties:
      error:
        $ref: '#/definitions/httpapi.ErrorDetail'
    type: object
  httpapi.HealthResponse:
    properties:
      status:
        example: ok
        type: string
    type: object
info:
  contact: {}
  description: Employee CRUD API. The list endpoint allows 10 requests per client
    IP per rolling 5-second window. Storage is currently process-local.
  title: Employee API
  version: "1.0"
paths:
  /api/v1/employees:
    get:
      description: Returns employees ordered by ID. Maximum 10 requests per client
        IP in any rolling 5-second window; blocked requests do not extend the window.
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/httpapi.EmployeeListResponse'
        "429":
          description: Too Many Requests
          headers:
            Retry-After:
              description: Seconds until the next request is allowed, rounded up
              type: integer
          schema:
            $ref: '#/definitions/httpapi.ErrorResponse'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/httpapi.ErrorResponse'
      summary: List employees
      tags:
      - employees
    post:
      consumes:
      - application/json
      description: Requires name, email, and department. Email is normalized and unique.
        Request body limit is 1 MiB.
      parameters:
      - description: Employee to create
        in: body
        name: employee
        required: true
        schema:
          $ref: '#/definitions/employee.EmployeeRequest'
      produces:
      - application/json
      responses:
        "201":
          description: Created
          headers:
            Location:
              description: Relative URL of the created employee
              type: string
          schema:
            $ref: '#/definitions/httpapi.EmployeeDataResponse'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/httpapi.ErrorResponse'
        "409":
          description: Conflict
          schema:
            $ref: '#/definitions/httpapi.ErrorResponse'
        "413":
          description: Request Entity Too Large
          schema:
            $ref: '#/definitions/httpapi.ErrorResponse'
        "415":
          description: Unsupported Media Type
          schema:
            $ref: '#/definitions/httpapi.ErrorResponse'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/httpapi.ErrorResponse'
      summary: Create employee
      tags:
      - employees
  /api/v1/employees/{id}:
    delete:
      parameters:
      - description: Positive employee ID
        in: path
        minimum: 1
        name: id
        required: true
        type: integer
      produces:
      - application/json
      responses:
        "204":
          description: Employee deleted; no response body
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/httpapi.ErrorResponse'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/httpapi.ErrorResponse'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/httpapi.ErrorResponse'
      summary: Delete employee
      tags:
      - employees
    get:
      parameters:
      - description: Positive employee ID
        in: path
        minimum: 1
        name: id
        required: true
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/httpapi.EmployeeDataResponse'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/httpapi.ErrorResponse'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/httpapi.ErrorResponse'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/httpapi.ErrorResponse'
      summary: Get employee
      tags:
      - employees
    put:
      consumes:
      - application/json
      description: 'Full replacement: name, email, and department are required. Request
        body limit is 1 MiB.'
      parameters:
      - description: Positive employee ID
        in: path
        minimum: 1
        name: id
        required: true
        type: integer
      - description: Replacement employee
        in: body
        name: employee
        required: true
        schema:
          $ref: '#/definitions/employee.EmployeeRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/httpapi.EmployeeDataResponse'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/httpapi.ErrorResponse'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/httpapi.ErrorResponse'
        "409":
          description: Conflict
          schema:
            $ref: '#/definitions/httpapi.ErrorResponse'
        "413":
          description: Request Entity Too Large
          schema:
            $ref: '#/definitions/httpapi.ErrorResponse'
        "415":
          description: Unsupported Media Type
          schema:
            $ref: '#/definitions/httpapi.ErrorResponse'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/httpapi.ErrorResponse'
      summary: Replace employee
      tags:
      - employees
  /healthz:
    get:
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/httpapi.HealthResponse'
      summary: Health check
      tags:
      - health
swagger: "2.0"
